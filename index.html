<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>16-Animal Risk Attitude Assessment</title>
<style>body{font-family:system-ui;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;background:#F8FAFC;color:#334155}.s{width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:a .7s linear infinite;margin:0 auto 1rem}@keyframes a{to{transform:rotate(360deg)}}</style>
</head><body>
<div style="text-align:center"><div class="s"></div><p>Loading assessment…</p></div>
<script>
(async()=>{
const n=8;
const parts=await Promise.all([...Array(n)].map((_,i)=>fetch('d'+i+'.txt').then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})));
const bin=atob(parts.join(''));
const bytes=new Uint8Array(bin.length);
for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
const html=new TextDecoder().decode(bytes);
document.open();document.write(html);document.close();
})().catch(e=>{document.body.innerHTML='<p style="text-align:center;padding:2rem">Load failed: '+e.message+'</p>'});
</script>
</body></html>
