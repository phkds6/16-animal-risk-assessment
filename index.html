<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>16-Animal Risk Attitude Assessment</title>
<style>body{font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;background:#F8FAFC;color:#334155}
.box{text-align:center;padding:2rem}.spin{width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:s 0.7s linear infinite;margin:0 auto 1rem}
@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="box"><div class="spin"></div><p>Loading assessment…</p></div>
<script>
(async () => {
  try {
    const parts = await Promise.all([0,1,2,3].map(i =>
      fetch('./part' + i + '.txt').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    ));
    const html = parts.join('');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<div class="box"><p>Could not load the assessment.</p><p style="color:#64748b;font-size:14px">' + e.message + '</p></div>';
  }
})();
</script>
</body>
</html>
